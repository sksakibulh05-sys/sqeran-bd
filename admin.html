<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন প্যানেল - সাইট কন্ট্রোল</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #334155; }
        .header h2 { color: #38bdf8; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); }
        .card h3 { color: #f1f5f9; margin-bottom: 15px; font-size: 16px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; font-size: 14px; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <h2>👑 অ্যাডমিন কন্ট্রোল প্যানেল</h2>
        <p style="font-size: 12px; color: #94a3b8;">ইউজারদের ব্যালেন্স ও রিকোয়েস্ট কন্ট্রোল করুন</p>
    </div>

    <div class="card">
        <h3>⚙️ ইউজার ব্যালেন্স ম্যানুয়ালি যুক্ত/কর্তন</h3>
        <div class="form-group">
            <label>ইউজারের মোবাইল নম্বর</label>
            <input type="text" id="targetPhone" placeholder="মোবাইল নম্বর লিখুন">
        </div>
        <div class="form-group">
            <label>টাকার পরিমাণ (সর্বোচ্চ লিমিট ৳১০০০)</label>
            <input type="number" id="amountInput" placeholder="টাকার পরিমাণ লিখুন">
        </div>
        <button class="btn btn-success" onclick="modifyBalance('add')">টাকা যোগ করুন</button>
        <button class="btn btn-danger" onclick="modifyBalance('deduct')">টাকা কেটে নিন</button>
    </div>

    <script>
        const MAX_LIMIT = 1000;

        function modifyBalance(action) {
            const phone = document.getElementById('targetPhone').value.trim();
            const amount = parseFloat(document.getElementById('amountInput').value);

            if (!phone || isNaN(amount)) {
                alert('দয়া করে সঠিক মোবাইল নম্বর এবং টাকার পরিমাণ দিন!');
                return;
            }

            let users = JSON.parse(localStorage.getItem('site_users')) || [];
            let targetUser = users.find(u => u.phone === phone);

            if (!targetUser) {
                alert('❌ এই নম্বরের কোনো ইউজার পাওয়া যায়নি!');
                return;
            }

            if (action === 'add') {
                if (targetUser.balance + amount > MAX_LIMIT) {
                    alert('⚠️ সিস্টেম অ্যালার্ট: ১,০০০ টাকা লিমিট পার হয়ে যাবে!');
                    return;
                }
                targetUser.balance += amount;
                alert(`সফল হয়েছে! ${targetUser.name}-এর অ্যাকাউন্টে ৳${amount} যোগ করা হয়েছে।`);
            } else if (action === 'deduct') {
                if (targetUser.balance < amount) {
                    alert('❌ ইউজারের অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!');
                    return;
                }
                targetUser.balance -= amount;
                alert(`সফল হয়েছে! ${targetUser.name}-এর অ্যাকাউন্ট থেকে ৳${amount} কেটে নেওয়া হয়েছে।`);
            }

            localStorage.setItem('site_users', JSON.stringify(users));
        }
    </script>
</body>
</html>
